<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUTOFB</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('autofb-theme') || 'light'; } catch(e) { document.documentElement.dataset.theme = 'light'; }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#EEF0FB; --blob1:#B9A6FF; --blob2:#9CC4FF; --blob3:#FFB8E1; --blob4:#9FF0E0;
  --win:rgba(255,255,255,.5); --side:rgba(255,255,255,.4);
  --surface:rgba(255,255,255,.72); --surface-2:rgba(255,255,255,.55); --surface-3:rgba(255,255,255,.9); --surface-solid:#FFFFFF;
  --card-fill:linear-gradient(160deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.66) 100%);
  --ink:#141428; --muted:#585A75; --faint:#8E90A8; --line:rgba(30,32,80,.08); --hover:rgba(90,80,220,.06);
  --glass-border:rgba(255,255,255,.95);
  --accent:#6A4DFF; --accent-g:linear-gradient(135deg,#7B5CFF 0%,#5A6BFF 55%,#3FA2FF 100%);
  --brand:linear-gradient(135deg,#7C5CFF 0%,#B05CFF 55%,#FF5CB8 100%);
  --hero:linear-gradient(130deg,#6D4BFF 0%,#8B5CF6 38%,#C05CFF 70%,#FF7AB6 100%);
  --g-violet:linear-gradient(135deg,#8B6CFF,#5B4BFF); --g-blue:linear-gradient(135deg,#4FA8FF,#3D6BFF);
  --g-pink:linear-gradient(135deg,#FF8FB8,#FF4D8D); --g-teal:linear-gradient(135deg,#2FD6B4,#12A6A0); --g-amber:linear-gradient(135deg,#FFC25C,#FF8A3D);
  --select:#6A4DFF; --select-soft:rgba(106,77,255,.1); --ok:#0E9F6E; --warn:#C26A00; --danger:#E5384F; --info:#2F6FE0;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 18px 40px -24px rgba(60,50,160,.35);
  --glow:0 10px 24px -10px rgba(106,77,255,.6);
  --win-shadow:0 40px 90px -40px rgba(70,60,170,.45);
  --mono:ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#070614; --blob1:#5B2BE0; --blob2:#1E3FA8; --blob3:#9B2BB8; --blob4:#0E6F7A;
    --win:rgba(20,18,38,.58); --side:rgba(255,255,255,.03);
    --surface:rgba(255,255,255,.06); --surface-2:rgba(255,255,255,.04); --surface-3:rgba(255,255,255,.09); --surface-solid:#1A1830;
    --card-fill:linear-gradient(160deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 100%);
    --ink:#F3F2FA; --muted:rgba(232,230,245,.68); --faint:rgba(232,230,245,.42); --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06);
    --glass-border:rgba(255,255,255,.11);
    --select:#9F8BFF; --select-soft:rgba(159,139,255,.16); --ok:#3DD598; --warn:#F5A524; --danger:#FF5C70; --info:#6FA2FF;
    --shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 20px 40px -24px rgba(0,0,0,.8);
    --glow:0 10px 26px -10px rgba(123,92,255,.8);
    --win-shadow:0 40px 90px -30px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#070614; --blob1:#5B2BE0; --blob2:#1E3FA8; --blob3:#9B2BB8; --blob4:#0E6F7A;
  --win:rgba(20,18,38,.58); --side:rgba(255,255,255,.03);
  --surface:rgba(255,255,255,.06); --surface-2:rgba(255,255,255,.04); --surface-3:rgba(255,255,255,.09); --surface-solid:#1A1830;
  --card-fill:linear-gradient(160deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 100%);
  --ink:#F3F2FA; --muted:rgba(232,230,245,.68); --faint:rgba(232,230,245,.42); --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06);
  --glass-border:rgba(255,255,255,.11);
  --select:#9F8BFF; --select-soft:rgba(159,139,255,.16); --ok:#3DD598; --warn:#F5A524; --danger:#FF5C70; --info:#6FA2FF;
  --shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  --glow:0 10px 26px -10px rgba(123,92,255,.8);
  --win-shadow:0 40px 90px -30px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after { box-sizing:border-box; }
html { height:100%; }
body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:13.5px; line-height:1.5; }
body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(40% 50% at 8% 18%, color-mix(in srgb,var(--blob1) 85%,transparent), transparent 70%),
    radial-gradient(45% 55% at 85% 95%, color-mix(in srgb,var(--blob2) 80%,transparent), transparent 70%),
    radial-gradient(35% 45% at 95% 8%, color-mix(in srgb,var(--blob3) 70%,transparent), transparent 70%),
    radial-gradient(35% 40% at 25% 100%, color-mix(in srgb,var(--blob4) 55%,transparent), transparent 70%),
    var(--bg); }
button, select, textarea, input { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--select); outline-offset:2px; border-radius:10px; }
.ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.muted { color:var(--muted); }
.faint { color:var(--faint); }

/* Window */
.win { position:relative; height:calc(100% - 28px); margin:14px; display:grid; grid-template-columns:248px minmax(0,1fr); border-radius:26px; overflow:hidden;
  background:var(--win); border:1px solid var(--glass-border); box-shadow:var(--win-shadow);
  backdrop-filter:blur(36px) saturate(1.5); -webkit-backdrop-filter:blur(36px) saturate(1.5); }

/* Sidebar */
.side { position:relative; display:flex; flex-direction:column; min-height:0; background:var(--side); border-right:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; padding:18px 16px 12px; }
.brand .logo { width:34px; height:34px; border-radius:10px; background:var(--hero); display:grid; place-items:center; flex:none; box-shadow:var(--glow); }
.brand b { font-size:14.5px; font-weight:700; white-space:nowrap; }
.nav { flex:1; overflow-y:auto; padding:6px 10px 12px; }
.nav .grp { padding:14px 10px 4px; color:var(--faint); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.nv { display:flex; align-items:center; gap:11px; width:100%; border:0; background:transparent; cursor:pointer; text-align:left; padding:8px 10px; border-radius:10px; color:var(--muted); font-weight:500; margin-bottom:2px; text-decoration:none; }
.nv:hover { background:var(--hover); color:var(--ink); }
.nv[aria-current="page"] { background:var(--accent-g); color:#fff; font-weight:600; box-shadow:var(--glow); }
.nv[aria-current="page"] .cnt { background:rgba(255,255,255,.25); color:#fff; }
.nv[aria-current="page"] .dot { box-shadow:0 0 0 2px rgba(255,255,255,.8); }
.nv .lb { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nv .dot { width:8px; height:8px; border-radius:50%; flex:none; margin:0 5px; }
.nv.add { color:var(--accent); }
.cnt { min-width:20px; height:20px; padding:0 6px; border-radius:6px; font-size:11px; font-weight:700; display:grid; place-items:center; background:var(--surface-3); color:var(--muted); }
.cnt.hot { background:var(--g-pink); color:#fff; }
.cnt:empty { display:none; }
.foot { position:relative; overflow:hidden; margin:10px 12px 14px; padding:14px; border-radius:16px; font-size:12px; color:rgba(255,255,255,.85); background:var(--hero); box-shadow:var(--glow); }
.foot::after { content:""; position:absolute; right:-30px; top:-30px; width:110px; height:110px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%); pointer-events:none; }
.foot b { color:#fff; font-size:13px; }
.scrim { display:none; }

/* Main */
.main { display:flex; flex-direction:column; min-width:0; min-height:0; }
.topbar { position:relative; z-index:20; display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--line); flex:none; }
.menu { display:none; border:0; background:transparent; cursor:pointer; padding:6px; color:var(--ink); }
.mode { font-size:12px; color:var(--muted); padding:5px 10px; border-radius:999px; border:1px solid var(--glass-border); background:var(--surface-2); white-space:nowrap; }
.mode i { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--warn); margin-right:6px; vertical-align:1px; }
.mode.live i { background:var(--ok); }
.spacer { flex:1; }
.icbtn { position:relative; width:36px; height:36px; border-radius:50%; border:0; background:transparent; cursor:pointer; display:grid; place-items:center; flex:none; color:var(--ink); }
.topbar > .icbtn { background:var(--surface-2); border:1px solid var(--glass-border); }
.icbtn:hover { background:var(--hover); }
.btn-stop { border:1px solid color-mix(in srgb,var(--danger) 45%,transparent); border-radius:10px; padding:7px 12px; cursor:pointer; font-weight:600; color:var(--danger); background:color-mix(in srgb,var(--danger) 10%,transparent); white-space:nowrap; }
.btn-stop[aria-pressed="true"] { background:var(--danger); color:#fff; }
.who { position:relative; }
.who > button { display:flex; align-items:center; gap:8px; border:1px solid var(--glass-border); background:var(--surface-2); border-radius:999px; padding:3px 12px 3px 3px; cursor:pointer; }
.who > button b { font-weight:600; white-space:nowrap; }
.drop { position:absolute; top:calc(100% + 8px); right:0; min-width:240px; background:var(--surface-solid); border:1px solid var(--glass-border); border-radius:14px; padding:6px; box-shadow:0 24px 48px -16px rgba(0,0,0,.5); z-index:30; }
.drop[hidden] { display:none; }
.drop button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; text-align:left; padding:8px 10px; border-radius:9px; cursor:pointer; }
.drop button:hover { background:var(--hover); }
.drop button[aria-checked="true"] { background:var(--select-soft); }
.drop .hd { padding:8px 10px 4px; color:var(--muted); font-size:12px; }
.drop hr { border:0; height:1px; background:var(--line); margin:6px 4px; }
.stopbar { display:none; margin:12px 26px 0; border-radius:12px; background:color-mix(in srgb,var(--danger) 14%,transparent); border:1px solid color-mix(in srgb,var(--danger) 40%,transparent); color:var(--danger); font-weight:600; padding:10px 16px; }
body.stopped .stopbar { display:block; }
.view-wrap { flex:1; overflow-y:auto; min-height:0; }
.ph { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:24px 26px 6px; max-width:1320px; margin:0 auto; }
.ph h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-.025em; line-height:1.2; }
.ph p { margin:4px 0 0; color:var(--muted); max-width:720px; }
.ph .acts { display:flex; gap:8px; flex-wrap:wrap; }
.view { padding:14px 26px 40px; max-width:1320px; margin:0 auto; }

/* Building blocks */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--glass-border); background:var(--surface-3); border-radius:10px; padding:8px 14px; cursor:pointer; font-weight:600; white-space:nowrap; text-decoration:none; }
.btn:hover { background:var(--hover); }
.btn-g { background:var(--accent-g); color:#fff; border-color:transparent; box-shadow:var(--glow); }
.btn-g:hover { filter:brightness(1.08); background:var(--accent-g); }
.btn-s { padding:5px 10px; font-size:12.5px; border-radius:8px; }
.btn-d { color:var(--danger); }
.btn:disabled { opacity:.5; pointer-events:none; }
.card { background:var(--card-fill); border:1px solid var(--glass-border); border-radius:20px; padding:18px; box-shadow:var(--shadow); min-width:0; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
.card h2 { margin:0 0 4px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.card h2 small { font-weight:500; color:var(--muted); font-size:12.5px; }
.card .sub { margin:0 0 12px; color:var(--muted); font-size:12.5px; }
.grid { display:grid; gap:14px; }
.g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.g3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
.kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:14px; }
.kpi { position:relative; overflow:hidden; background:var(--card-fill); border:1px solid var(--glass-border); border-radius:20px; padding:16px 18px; box-shadow:var(--shadow); }
.kpi .ki { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; background:var(--g,var(--g-violet)); margin-bottom:12px; box-shadow:0 8px 18px -8px rgba(60,40,200,.55); }
.kpi span { color:var(--muted); font-size:12.5px; font-weight:500; }
.kpi b { display:block; font-size:28px; font-weight:800; letter-spacing:-.03em; margin-top:2px; font-variant-numeric:tabular-nums; line-height:1.2; }
.kpi small { color:var(--faint); font-size:12px; }
.kpi.hero { background:var(--hero); border-color:transparent; color:#fff; box-shadow:var(--glow); }
.kpi.hero::after { content:""; position:absolute; right:-40px; bottom:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%); pointer-events:none; }
.kpi.hero .ki { background:rgba(255,255,255,.22); box-shadow:none; }
.kpi.hero span, .kpi.hero small { color:rgba(255,255,255,.85); }
/* Biểu đồ hoạt động */
.chart-wrap { display:grid; grid-template-columns:minmax(0,1fr) 180px; gap:18px; align-items:center; }
.chart svg { width:100%; height:auto; display:block; }
.chart .ax { fill:var(--faint); font-size:11px; }
.chart .gl { stroke:var(--line); }
.legend { display:flex; flex-direction:column; gap:14px; }
.legend div b { display:block; font-size:24px; font-weight:800; letter-spacing:-.02em; }
.legend div span { color:var(--muted); font-size:12.5px; display:flex; align-items:center; gap:6px; }
.legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
.prog { margin-top:6px; height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
.prog i { display:block; height:100%; border-radius:4px; background:var(--accent-g); }
/* Tiến trình agent */
.live { margin:12px 0 4px; padding:12px 14px; border-radius:14px; background:var(--select-soft); border:1px solid color-mix(in srgb,var(--accent) 28%,transparent); }
.live.stale { background:color-mix(in srgb,var(--warn) 10%,transparent); border-color:color-mix(in srgb,var(--warn) 30%,transparent); }
.live .lh { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:13px; }
.live .lh span { color:var(--muted); font-size:12px; white-space:nowrap; }
.lbar { position:relative; height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:8px; }
.lbar i { position:relative; display:block; height:100%; border-radius:4px; background:var(--accent-g); overflow:hidden; transition:width .6s; }
.lbar i::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent); transform:translateX(-100%); animation:shine 1.6s infinite; }
.lbar.ind i { width:30%; animation:slide 1.4s ease-in-out infinite; }
@keyframes shine { to { transform:translateX(100%); } }
@keyframes slide { from { margin-left:-30%; } to { margin-left:100%; } }
.lmeta { margin-top:6px; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lmeta.warn { color:var(--warn); white-space:normal; }
.tcard .live { margin:8px 0 0; padding:8px 10px; }
.tcard .live .lh { font-size:12px; }
@media (prefers-reduced-motion: reduce) { .lbar i::after, .lbar.ind i { animation:none; } .lbar.ind i { width:100%; opacity:.5; } }
.tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--surface-3); color:var(--muted); border:1px solid var(--line); white-space:nowrap; }
.tag.blue { color:var(--info); background:color-mix(in srgb,var(--info) 12%,transparent); border-color:transparent; }
.tag.ok { color:var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent); border-color:transparent; }
.tag.warn { color:var(--warn); background:color-mix(in srgb,var(--warn) 13%,transparent); border-color:transparent; }
.tag.bad { color:var(--danger); background:color-mix(in srgb,var(--danger) 12%,transparent); border-color:transparent; }
.tag.acc { color:var(--select); background:var(--select-soft); border-color:transparent; }
.av { width:30px; height:30px; border-radius:50%; display:inline-grid; place-items:center; background:var(--g,var(--brand)); color:#fff; font-weight:700; font-size:12.5px; flex:none; }
.av.s { width:22px; height:22px; font-size:10.5px; }
.av.l { width:44px; height:44px; font-size:17px; }
.row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
.row:first-child { border-top:0; }
.row > .bd { flex:1; min-width:0; }
.row b { font-weight:600; }
.row .d { display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; }
.row.click { cursor:pointer; border-radius:10px; padding-left:8px; padding-right:8px; margin:0 -8px; }
.row.click:hover { background:var(--hover); }
.empty { padding:18px; border:1px dashed var(--faint); border-radius:14px; color:var(--muted); text-align:center; }
.empty b { color:var(--ink); display:block; margin-bottom:2px; }
.note { padding:10px 12px; border-radius:12px; background:var(--surface-3); border:1px solid var(--line); color:var(--muted); font-size:12.5px; margin-top:10px; }
.note.warn { color:var(--warn); background:color-mix(in srgb,var(--warn) 10%,transparent); border-color:color-mix(in srgb,var(--warn) 30%,transparent); }
.note.ok { color:var(--ok); background:color-mix(in srgb,var(--ok) 10%,transparent); border-color:color-mix(in srgb,var(--ok) 30%,transparent); }
.field-label { display:block; font-weight:600; font-size:12.5px; margin:14px 0 6px; }
.field-label:first-child { margin-top:0; }
.field-label small { font-weight:400; color:var(--muted); }
.inp { width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:9px 12px; }
.inp:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--select-soft); }
textarea.inp { resize:vertical; min-height:80px; }
textarea.code { font-family:var(--mono); font-size:12.5px; line-height:1.55; min-height:200px; }
select.inp { cursor:pointer; }
.bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; background:var(--accent-g); }
.bar.ok i { background:var(--ok); }
.tg { position:relative; width:40px; height:23px; flex:none; display:inline-block; }
.tg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; z-index:1; }
.tg i { position:absolute; inset:0; border-radius:12px; background:var(--line); transition:.2s; pointer-events:none; }
.tg i::after { content:""; position:absolute; left:3px; top:3px; width:17px; height:17px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.tg input:checked + i { background:var(--accent); }
.tg input:checked + i::after { transform:translateX(17px); }
.tg input:focus-visible + i { outline:2px solid var(--select); outline-offset:2px; }
pre.code { margin:8px 0 0; padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-family:var(--mono); font-size:12px; line-height:1.55; white-space:pre-wrap; word-break:break-word; max-height:360px; overflow:auto; }

/* Agent cards */
.acard { position:relative; overflow:hidden; display:flex; flex-direction:column; gap:10px; cursor:pointer; text-align:left; color:inherit; font:inherit; width:100%; transition:transform .2s, box-shadow .2s; }
.acard::before { content:""; position:absolute; left:0; right:0; top:0; height:4px; background:var(--g,var(--accent-g)); }
.acard:hover { transform:translateY(-2px); box-shadow:var(--shadow), var(--glow); }
.acard .top { display:flex; align-items:center; gap:10px; }
.acard .top b { font-size:14.5px; }
.acard p { margin:0; color:var(--muted); font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.mini { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.mini div { background:var(--surface-2); border-radius:10px; padding:7px 9px; }
.mini span { display:block; color:var(--faint); font-size:11px; }
.mini b { font-size:14px; font-variant-numeric:tabular-nums; }
.bot { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--g,var(--brand)); color:#fff; flex:none; }
.bot.l { width:44px; height:44px; border-radius:13px; }
.bot .ico { width:18px; height:18px; }
.bot.l .ico { width:24px; height:24px; }

/* Agent builder */
.ahead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:4px 0 16px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tabs a { padding:10px 12px; color:var(--muted); text-decoration:none; font-weight:600; border-bottom:2px solid transparent; white-space:nowrap; display:flex; gap:6px; align-items:center; }
.tabs a:hover { color:var(--ink); }
.tabs a[aria-current="page"] { color:var(--ink); border-color:var(--accent); }
.steplist .st { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--surface-2); }
.steplist .st .n { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--accent-g); color:#fff; font-weight:700; font-size:12px; flex:none; }
.steplist .st input.inp { flex:1; min-width:0; padding:6px 10px; }
.steplist .st label { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
.opt { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line); border-radius:14px; margin-bottom:8px; cursor:pointer; }
.opt:hover { background:var(--hover); }
.opt:has(input:checked) { border-color:var(--accent); box-shadow:0 0 0 3px var(--select-soft); }
.opt input { margin:3px 0 0; accent-color:var(--accent); width:16px; height:16px; flex:none; }
.opt b { display:block; }
.opt span { color:var(--muted); font-size:12.5px; }
.opt.locked { cursor:default; opacity:.85; }
.lesson { padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--surface-2); }
.lesson.off { opacity:.55; }
.lesson p { margin:6px 0 0; white-space:pre-wrap; }
.lesson .meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--faint); }
.lesson .meta .sp { flex:1; }
.mrow { display:grid; grid-template-columns:minmax(0,1.6fr) 90px 70px 90px 32px; gap:8px; align-items:center; margin-bottom:8px; }
.mrow .inp { padding:6px 10px; }
.mrow.hd { color:var(--faint); font-size:11.5px; margin-bottom:4px; }
.crit { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.crit .inp { padding:6px 10px; }

/* Board */
.filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:4px 12px 4px 4px; cursor:pointer; font-weight:500; }
.chip.t { padding:5px 12px; }
.chip[aria-pressed="true"] { border-color:var(--accent); background:var(--select-soft); color:var(--ink); font-weight:600; }
.board { display:grid; grid-template-columns:repeat(5,minmax(220px,1fr)); gap:12px; overflow-x:auto; padding-bottom:8px; }
.col { position:relative; overflow:hidden; background:var(--surface-2); border:1px solid var(--glass-border); border-radius:18px; padding:14px 10px 10px; min-height:200px; }
.col::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--g,var(--line)); }
.col[data-st="dang-lam"] { --g:var(--g-blue); } .col[data-st="can-sua"] { --g:var(--g-pink); } .col[data-st="cho-duyet"] { --g:var(--g-amber); } .col[data-st="xong"] { --g:var(--g-teal); } .col[data-st="moi"] { --g:var(--g-violet); }
.col h3 { margin:2px 4px 10px; font-size:13px; display:flex; align-items:center; gap:8px; }
.col h3 .cnt { margin-left:auto; }
.tcard { display:block; width:100%; text-align:left; border:1px solid var(--glass-border); background:var(--surface-3); border-radius:14px; padding:11px 13px; margin-bottom:8px; cursor:pointer; color:inherit; font:inherit; box-shadow:0 6px 16px -12px rgba(40,30,120,.4); }
.tcard:hover { border-color:color-mix(in srgb,var(--accent) 50%,transparent); }
.tcard b { display:block; font-weight:600; line-height:1.35; }
.tcard .ln { display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
.tcard .ln .sp { flex:1; }
.arrow { color:var(--faint); }

/* Dialog */
dialog.dlg { width:min(720px,94vw); max-height:90vh; border:1px solid var(--glass-border); border-radius:20px; padding:0; background:var(--surface-solid); color:var(--ink); box-shadow:0 40px 80px -30px rgba(0,0,0,.7); }
dialog.dlg.sm { width:min(520px,94vw); }
dialog.dlg::backdrop { background:rgba(6,5,13,.55); backdrop-filter:blur(4px); }
.dh { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 22px 0; }
.dh b { font-size:16px; line-height:1.35; }
.db { padding:14px 22px 6px; }
.df { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; padding:14px 22px 20px; }
.df .sp { flex:1; }
.stepper { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; }
.stepper span { padding:4px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--faint); display:flex; gap:5px; align-items:center; }
.stepper span.done { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent); }
.stepper span.cur { color:var(--ink); border-color:var(--accent); background:var(--select-soft); font-weight:600; }
.timeline { border-left:2px solid var(--line); margin:6px 0 0 6px; padding-left:14px; }
.timeline div { position:relative; padding:4px 0 8px; font-size:12.5px; }
.timeline div::before { content:""; position:absolute; left:-20px; top:10px; width:10px; height:10px; border-radius:50%; background:var(--surface-solid); border:2px solid var(--faint); }
.timeline time { color:var(--faint); margin-right:6px; }
.out { padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); margin-top:8px; white-space:pre-wrap; font-size:13px; }
.out .meta { font-size:12px; color:var(--faint); margin-bottom:4px; white-space:normal; }
.checks label { display:flex; gap:8px; align-items:flex-start; padding:6px 0; cursor:pointer; }
.checks input { accent-color:var(--accent); width:16px; height:16px; margin-top:2px; }
.toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--surface-solid); color:var(--ink); border:1px solid var(--glass-border); border-radius:12px; padding:10px 16px; box-shadow:0 20px 40px -16px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:.25s; z-index:100; max-width:calc(100vw - 32px); }
.toast.on { opacity:1; transform:translate(-50%,0); }
.fbbtn { display:inline-flex; align-items:center; justify-content:center; gap:10px; border:0; border-radius:12px; padding:10px 16px; background:#1877F2; color:#fff; font-weight:700; cursor:pointer; }

/* Tổ chức agent */
.org { position:relative; }
.org-lead { position:relative; overflow:hidden; max-width:760px; margin:0 auto; padding:20px 22px; border-radius:24px; background:var(--hero); color:#fff; box-shadow:var(--glow); }
.org-lead::after { content:""; position:absolute; right:-60px; top:-80px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%); pointer-events:none; }
.org-lead .hd { display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:relative; z-index:1; }
.org-lead .hd .bot { background:rgba(255,255,255,.22); }
.org-lead .muted, .org-lead small { color:rgba(255,255,255,.85); }
.org-lead p { margin:10px 0 0; color:rgba(255,255,255,.9); position:relative; z-index:1; }
.org-lead .mini div { background:rgba(255,255,255,.16); }
.org-lead .mini span { color:rgba(255,255,255,.8); }
.org-lead .btn { background:rgba(255,255,255,.18); color:#fff; border-color:rgba(255,255,255,.3); }
.org-lead .btn:hover { background:rgba(255,255,255,.28); }
.org-lead .tag { background:rgba(255,255,255,.2); color:#fff; border-color:transparent; }
.org-lead .state { color:rgba(255,255,255,.9); }
.org-lead .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; position:relative; z-index:1; }
.org-lead .mini { margin-top:14px; position:relative; z-index:1; grid-template-columns:repeat(4,minmax(0,1fr)); }
.org-wire { position:relative; height:44px; }
.org-wire::before { content:""; position:absolute; left:50%; top:0; height:22px; border-left:2px solid color-mix(in srgb,var(--accent) 55%,transparent); }
.org-wire::after { content:""; position:absolute; left:10%; right:10%; top:22px; height:22px; border:2px solid color-mix(in srgb,var(--accent) 55%,transparent); border-bottom:0; border-radius:14px 14px 0 0; }
.org-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
.ocard { position:relative; display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:20px; background:var(--card-fill); border:1px solid var(--glass-border); box-shadow:var(--shadow); min-width:0; }
.ocard::before { content:""; position:absolute; left:0; right:0; top:0; height:4px; border-radius:20px 20px 0 0; background:var(--g,var(--accent-g)); }
.ocard .top { display:flex; align-items:center; gap:10px; }
.ocard .role { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
.ocard .nm { font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
.ocard p { margin:0; color:var(--muted); font-size:12.5px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.ocard .mini { grid-template-columns:repeat(2,minmax(0,1fr)); }
.ocard .acts { display:flex; gap:6px; margin-top:auto; }
.ocard .acts .btn { flex:1; justify-content:center; }
.ocard.missing { border:1px dashed var(--faint); background:transparent; box-shadow:none; justify-content:center; text-align:center; align-items:center; }
.ocard.missing::before { display:none; }
.ocard .step { position:absolute; top:12px; right:12px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; background:var(--surface-3); color:var(--muted); }
.state { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); min-width:0; }
.state i { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
.state.on i { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent); }
.state.busy i { background:var(--info); box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 25%,transparent); }
.state span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.flow { font-size:12.5px; color:var(--muted); margin:14px 0 0; line-height:1.7; }
.flow b { color:var(--ink); }
.goal { padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface-2); margin-bottom:8px; }
.goal .gh { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.goal .gh b { flex:1; min-width:0; }
.goal .prog { margin-top:8px; }
/* Second Brain */
.brain { display:grid; grid-template-columns:220px minmax(0,1fr); gap:14px; align-items:start; }
.brain-side { position:sticky; top:12px; }
.brain-side a { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; color:var(--muted); text-decoration:none; font-weight:600; }
.brain-side a:hover { background:var(--hover); color:var(--ink); }
.brain-side a[aria-current="page"] { background:var(--select-soft); color:var(--ink); }
.brain-side a .k { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; color:#fff; background:var(--g,var(--accent-g)); flex:none; }
.brain-side a .k .ico { width:15px; height:15px; }
.brain-side a .cnt { margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }
.bform summary { cursor:pointer; list-style:none; display:flex; align-items:center; }
.bform summary::-webkit-details-marker { display:none; }
.bform summary h2 { display:flex !important; align-items:center; gap:8px; margin:0; }
.bform summary h2 .ico { width:18px; height:18px; }
.bform summary::after { content:"▾"; margin-left:auto; color:var(--faint); }
.bform[open] summary::after { content:"▴"; }
.brain-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.brain-head .inp { flex:1; min-width:180px; }
.notes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.bnote { position:relative; padding:12px 14px 12px 16px; border:1px solid var(--line); border-radius:14px; background:var(--surface-2); min-width:0; }
.bnote::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:3px; background:var(--g,var(--accent-g)); }
.bnote.off { opacity:.55; }
.bnote.pin { border-color:color-mix(in srgb,var(--accent) 45%,transparent); }
.bnote .meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px; color:var(--faint); }
.bnote .meta .sp { flex:1; }
.bnote h4 { margin:8px 0 0; font-size:13.5px; }
.bnote p { margin:6px 0 0; white-space:pre-wrap; font-size:13px; overflow-wrap:anywhere; }
.bnote a.url { display:inline-block; margin-top:6px; font-size:12.5px; overflow-wrap:anywhere; }
.bnote .tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
.bnote .tools { display:flex; align-items:center; gap:6px; }
.bnote .tools .icbtn { width:28px; height:28px; }
.bnote .tools .icbtn[aria-pressed="true"] { color:var(--accent); }
@media (max-width: 1100px) {
  .org-row { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .org-wire::after { left:16%; right:16%; }
  .notes { grid-template-columns:minmax(0,1fr); }
}
@media (max-width: 820px) {
  .org-row { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .org-lead .mini { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .brain { grid-template-columns:minmax(0,1fr); }
  .brain-side { position:static; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  .brain-side a { white-space:nowrap; }

}
@media (max-width: 520px) {
  .org-row { grid-template-columns:minmax(0,1fr); }
  .org-wire { height:22px; }
  .org-wire::after { display:none; }
}
@media (max-width: 1100px) {
  .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .g3 { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
/* Research */
.journey { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin-bottom:16px; }
.journey a { position:relative; display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:16px; text-decoration:none; color:var(--muted); background:var(--card-fill); border:1px solid var(--glass-border); box-shadow:var(--shadow); font-weight:600; min-width:0; }
.journey a .n { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; flex:none; font-size:12.5px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); }
.journey a .l { line-height:1.25; font-size:12.5px; }
.journey a.done .n { background:var(--g-teal); color:#fff; border-color:transparent; }
.journey a.next .n { background:var(--accent-g); color:#fff; border-color:transparent; }
.journey a.lock { opacity:.55; cursor:not-allowed; box-shadow:none; }
.journey a.cur { background:var(--hero); color:#fff; border-color:transparent; box-shadow:var(--glow); }
.journey a.cur .n { background:rgba(255,255,255,.25); color:#fff; }
.markets { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.market { display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; padding:14px; border-radius:16px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; color:inherit; font:inherit; }
.market:hover { border-color:color-mix(in srgb,var(--accent) 45%,transparent); }
.market.on { border-color:var(--accent); box-shadow:0 0 0 3px var(--select-soft), var(--glow); background:var(--surface-3); }
.market .code { font-weight:800; font-size:12px; letter-spacing:.06em; padding:3px 8px; border-radius:8px; background:var(--accent-g); color:#fff; margin-bottom:4px; }
.market b { font-size:15px; }
.market small { color:var(--muted); font-size:12px; line-height:1.4; }
.nextbar { display:flex; justify-content:flex-end; margin-top:16px; }
.h3 { margin:18px 0 6px; font-size:13.5px; }
.topic { display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:14px; margin-bottom:8px; background:var(--surface-2); }
.topic.on { border-color:var(--accent); box-shadow:0 0 0 3px var(--select-soft); }
.topic > input { accent-color:var(--accent); width:17px; height:17px; margin-top:3px; flex:none; }
.topic .bd { flex:1; min-width:0; }
.topic .tt { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.topic p { margin:3px 0 6px; color:var(--muted); font-size:12.5px; }
.topic .sig { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--faint); }
.topic .sig i { font-style:normal; color:var(--accent); letter-spacing:-1px; margin-left:3px; }
.topic .sig em { font-style:normal; color:var(--line); }
.topic details { margin-top:6px; font-size:12.5px; }
.topic summary { cursor:pointer; color:var(--muted); }
.topic .q { padding:4px 0 0 10px; border-left:2px solid var(--select-soft); margin-top:4px; }
.topic .sub2 { margin:8px 0 2px; font-weight:600; color:var(--ink); font-size:12px; }
.topic .src { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.topic .src a, .topic .src span { font-size:11.5px; padding:2px 8px; border-radius:999px; background:var(--surface-3); border:1px solid var(--line); color:var(--muted); text-decoration:none; }
.score { flex:none; width:54px; height:54px; border-radius:50%; display:grid; place-content:center; text-align:center; background:conic-gradient(#7B5CFF calc(var(--p) * 1%), var(--line) 0); position:relative; }
.score::before { content:""; position:absolute; inset:5px; border-radius:50%; background:var(--surface-solid); }
.score b, .score span { position:relative; line-height:1.1; }
.score b { font-size:15px; font-weight:800; }
.score span { font-size:9.5px; color:var(--faint); }
.checks.big label { padding:10px 0; border-top:1px solid var(--line); }
.checks.big label:first-child { border-top:0; }
.morning { position:relative; overflow:hidden; }
.morning::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,#FFC25C,#FF7AB6,#7B5CFF); }
.ki-sun { width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:var(--g-amber); color:#fff; }
.ki-sun .ico { width:16px; height:16px; }
.mhead { display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.mhead > div { flex:1; min-width:200px; }
.mset { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); }

.cc-main { display:flex; flex-direction:column; min-height:calc(100vh - 260px); padding:0; overflow:hidden; }

.cc-user { align-self:flex-end; max-width:80%; background:var(--accent-g); color:#fff; padding:10px 14px; border-radius:16px 16px 4px 16px; white-space:pre-wrap; overflow-wrap:anywhere; }

function stats(a){
  const tasks = ws.tasks.filter(t => t.agentId === a.id);
  const done = tasks.filter(t => t.status === 'xong').sort((x, y) => (y.doneAt || 0) - (x.doneAt || 0)).slice(0, 10);
  const first = done.filter(t => !t.returns).length;
  const judged = done.filter(t => t.dodOk != null);
  return { total:tasks.length, open:tasks.filter(t => t.status !== 'xong').length, done:done.length,
    firstPass:pct(first, done.length), first, dod:pct(judged.filter(t => t.dodOk).length, judged.length), lessons:lessonsOf(a.id).length };
}
function metricValue(a, m, s = stats(a)){
  if (m.src === 'auto:firstpass') return s.firstPass;
  if (m.src === 'auto:dod') return s.dod;
  return m.value === '' || m.value == null ? null : m.value;
}
function readiness(a){
  const s = stats(a);
  const ms = a.metrics.map(m => ({ m, v:metricValue(a, m, s) }));
  const known = ms.filter(x => x.v != null && x.v !== '' && x.m.target !== '');
  const met = known.filter(x => +x.v >= +x.m.target);
  return { s, ms, known:known.length, met:met.length, ready: s.done >= 5 && known.length > 0 && met.length === known.length };
}

function hist(t, who, text){ t.history.push({ at:now(), who, text }); t.updatedAt = now(); }
function submitResult(t, output, by, metrics){
  const a = byId('agents', t.agentId); if (!a) return;
  const st = a.steps[t.step];
  t.outputs.push({ step:t.step, by, at:now(), text:output });
  if (metrics) a.metrics.forEach(m => { if (m.src === 'agent' && metrics[m.name] != null) m.value = String(metrics[m.name]); });
  if (a.mode !== 'auto' && st && st.review && !t.noReview){ t.status = 'cho-duyet'; hist(t, by, `Nộp kết quả bước “${st.name}”, chờ duyệt`); }
  else advance(t, a, by, a.mode === 'auto' ? 'tự duyệt (chế độ tự động)' : 'bước này không cần duyệt');
  if (metrics) put('agents', a);
}
function advance(t, a, by, how){
  const st = a.steps[t.step];
  // t.until: task chỉ chạy tới bước này (ví dụ Leader chỉ làm “Kiểm duyệt tên kênh”). Bản sao trong applyResult() ở server.js.
  const lastStep = Number.isInteger(t.until) ? Math.min(t.until, a.steps.length - 1) : a.steps.length - 1;
  if (t.step < lastStep){ t.step++; t.status = 'moi'; hist(t, by, `Qua bước “${st ? st.name : ''}” (${how}), sang bước “${a.steps[t.step].name}”`); }
  else { t.status = 'xong'; t.doneAt = now(); hist(t, by, `Xong (${how})`); }
}

}

// Hoạt động 7 ngày của các agent: số kết quả nộp và số task xong mỗi ngày.
function activityCard(mine){
  const ids = new Set(mine.map(a => a.id));
  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  const days = [...Array(7)].map((_, i) => { const d = new Date(day0); d.setDate(d.getDate() - 6 + i); return d.getTime(); });
  const idx = t => { const i = Math.floor((t - days[0]) / 864e5); return i >= 0 && i < 7 ? i : -1; };
  const outs = Array(7).fill(0), dones = Array(7).fill(0);
  ws.tasks.filter(t => ids.has(t.agentId)).forEach(t => {
    t.outputs.forEach(o => { const i = idx(o.at); if (i >= 0) outs[i]++; });
    if (t.doneAt) { const i = idx(t.doneAt); if (i >= 0) dones[i]++; }
  });
  const max = Math.max(4, ...outs, ...dones), W = 380, H = 180, L = 22, B = 24, T = 8;
  const ch = H - B - T, cw = (W - L) / 7, bw = 11;
  const y = v => T + ch - v / max * ch;
  let g = '';
  [0, .5, 1].forEach(f => { const v = Math.round(max * f); g += `<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="0" y="${y(v) + 4}">${v}</text>`; });
  const DOW = ['CN','T2','T3','T4','T5','T6','T7'];
  days.forEach((d, i) => {
    const cx = L + cw * i + cw / 2;
    const bar = (v, x, fill) => v ? `<rect x="${x}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="6" fill="${fill}"><title>${v}</title></rect>` : `<rect x="${x}" y="${y(0) - 3}" width="${bw}" height="3" rx="1.5" fill="var(--line)"/>`;
    g += bar(outs[i], cx - bw - 2, 'url(#gOut)') + bar(dones[i], cx + 2, 'url(#gDone)');
    g += `<text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle">${i === 6 ? 'Hôm nay' : DOW[new Date(d).getDay()]}</text>`;
  });
  const sum = a => a.reduce((x, y) => x + y, 0);
  return `<div class="card chart"><h2>Hoạt động 7 ngày <small>cả đội agent</small></h2><p class="sub">Số kết quả agent nộp và số task xong mỗi ngày.</p>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ: ${sum(outs)} kết quả nộp, ${sum(dones)} task xong trong 7 ngày">
      <defs><linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DB8FF"/><stop offset="1" stop-color="#5A7BFF"/></linearGradient>
      <linearGradient id="gDone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C77DFF"/><stop offset="1" stop-color="#6A4DFF"/></linearGradient></defs>${g}</svg>
    <div class="legend"><div><b>${sum(outs)}</b><span><i style="background:linear-gradient(#9DB8FF,#5A7BFF)"></i>Kết quả nộp</span></div><div><b>${sum(dones)}</b><span><i style="background:linear-gradient(#C77DFF,#6A4DFF)"></i>Task xong</span></div></div></div></div>`;
}
// Mỗi agent còn cách “tự động” bao xa: số chỉ số đã đạt trên số chỉ số có số liệu.
function progressCard(mine){

const SRC = { 'tra-lai':['Từ lần trả lại','bad'], duyet:['Từ lần duyệt','ok'], tay:['Ghi tay','acc'], agent:['Agent tự ghi','blue'], leader:['Leader phản hồi','acc'] };
let brainKindSel = 'all';
// Một thẻ ghi nhớ trong Second Brain.

// Không gian Second Brain của một agent: chia theo loại, tìm nhanh, thêm ghi nhớ.
function brainSpace(a, own){

    kinds.map(k => `<a href="#" data-act="brain-kind" data-k="${k}" ${sel === k ? 'aria-current="page"' : ''}><span class="k" style="--g:${BRAIN_KINDS[k].g}">${IC[BRAIN_KINDS[k].icon]}</span>${BRAIN_KINDS[k].label}<span class="cnt">${all.filter(b => brainKind(b) === k).length}</span></a>`).join('') + `</nav>`;

    <div><label class="field-label" for="bnTitle">Tiêu đề <small>không bắt buộc</small></label><input class="inp" id="bnTitle" placeholder="Ví dụ: Hook mở đầu bằng con số" ${dis}></div></div>
    <label class="field-label" for="bnText">Nội dung</label><textarea class="inp" id="bnText" placeholder="Ví dụ: Khán giả Mỹ phản hồi tốt với hook nêu thời gian cụ thể (“in 10 minutes”)." ${dis}></textarea>
    <div class="grid g2"><div><label class="field-label" for="bnUrl">Liên kết <small>không bắt buộc</small></label><input class="inp" id="bnUrl" placeholder="https://" ${dis}></div>
    <div><label class="field-label" for="bnTags">Nhãn <small>cách nhau bằng dấu phẩy</small></label><input class="inp" id="bnTags" placeholder="hook, mỹ, nấu ăn" ${dis}></div></div>
    <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:8px">${own ? '' : ''}<button class="btn btn-g" type="button" data-act="brain-add" ${dis}>${IC.plus}Lưu vào Second Brain</button></div></details>`;
  const head = `<div class="brain-head"><input class="inp" id="brainQ" type="search" placeholder="Tìm trong Second Brain…" aria-label="Tìm trong Second Brain"><span class="tag ok">${active} đang dùng</span><span class="tag">${all.length} mục</span></div>`;
  const body = list.length ? `<div class="notes" id="brainNotes">${list.map(b => brainNote(b, own)).join('')}</div><div class="empty" id="brainNone" hidden>Không có mục nào khớp.</div>`

  return `<div class="brain">${side}<div>${brainChat(a, own)}${form}<div class="card"><h2 style="margin-bottom:10px">Second Brain của ${esc(a.name)}</h2>${head}${body}
    <div class="note">Khi kho dày lên, gộp các mục trùng ý thành một và tắt mục cũ để gói ngữ cảnh gọn. Bài học và phản hồi gửi dạng câu; kiến thức, mẫu hay, liên kết gửi kèm tiêu đề.</div></div></div></div>`;

function importTopics(rp, text, sample){
  let data;

    const a = text.indexOf('{'), b = text.lastIndexOf('}');
    try { data = JSON.parse(text.slice(a, b + 1)); } catch(err) { return -1; }
  }
  const list = Array.isArray(data) ? data : data?.topics;
  if (!Array.isArray(list)) return -1;
  const n5 = v => Math.min(5, Math.max(1, Math.round(+v || 3)));
  let n = 0;
  list.forEach(x => {
    if (!x || !x.title) return;
    const t = { id:uid('tp'), title:String(x.title).slice(0, 200), summary:String(x.summary || ''), audience:String(x.audience || ''),
      questions:(x.questions || []).map(String).slice(0, 10), demand:n5(x.demand), growth:n5(x.growth), engagement:n5(x.engagement),
      competition:n5(x.competition), monetization:n5(x.monetization),
      sources:(x.sources || []).map(s => typeof s === 'string' ? { name:s } : { name:String(s.name || s.url || ''), url:/^https?:\/\//.test(s.url || '') ? s.url : '' }).slice(0, 10),
      angles:(Array.isArray(x.angles) ? x.angles : []).map(String).slice(0, 8),
      reasons:Object.fromEntries(Object.entries(x.reasons && typeof x.reasons === 'object' ? x.reasons : {}).map(([k, v]) => [k, String(v)]).filter(([, v]) => v)),
      sample:!!sample, at:now() };
    const old = rp.topics.findIndex(o => norm(o.title) === norm(t.title));
    if (old >= 0) { t.id = rp.topics[old].id; t.firstAt = rp.topics[old].firstAt || rp.topics[old].at; rp.topics[old] = t; } else { t.firstAt = t.at; rp.topics.push(t); }
    n++;
  });

    if (!x || !x.name) return;
    rp.pageIdeas = rp.pageIdeas.filter(o => norm(o.name) !== norm(x.name));

      sample:!!sample, at:now() });

  return n;

const bcStrip = t => { const i = String(t || '').indexOf(BC_MARK); return i >= 0 ? t.slice(i + BC_MARK.length) : String(t || ''); };

}
const bcMd = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');

    <button class="btn btn-s btn-g" type="button" data-act="bc-save" data-n="${n}" data-pi="${pi}" ${items.every((x, i) => saved.has(ref(i))) ? 'disabled' : ''}>Lưu mục đã chọn</button></div>`;
}
function bcEvent(e, a){

  if (e.k === 'text') return `<div class="bc-ai">${bcBlocks(e.text || '').map((p, pi) => p.t === 'txt' ? (p.v.trim() ? `<div>${bcMd(p.v.trim())}</div>` : '') : bcProposal(p.v, e.n, pi, a)).join('')}</div>`;

}
const bcLogHtml = a => bc.events.map(e => bcEvent(e, a)).join('') || '<div class="empty" style="padding:14px">Chưa có tin nhắn. Ví dụ: “Đây là tài liệu brand voice của page, tóm thành quy tắc cho agent” (đính kèm tệp), hoặc “Dạy agent 5 kiểu hook đang hiệu quả với khán giả Mỹ”.</div>';

  const ul = xs => Array.isArray(xs) && xs.length ? `<ul class="pul">${xs.map(x => `<li>${esc(typeof x === 'string' ? x : JSON.stringify(x))}</li>`).join('')}</ul>` : '';
  const H = (t, sub) => `<h4 class="ph4">${t}${sub ? ` <small>${sub}</small>` : ''}</h4>`;
  let h = '';
  const st = d.strategy;
  if (st) {
    if (st.summary) h += `<div class="note" style="margin-top:6px">${esc(st.summary)}</div>`;
    if (st.mission) h += `<div class="pmission">“${esc(st.mission)}”</div>`;
    if (st.narrator) { const n = st.narrator; h += H('Người kể của page', esc(n.name || '')) + `<div class="pbox"><p>${esc(n.who || '')}</p>${n.speech ? `<small>Cách nói</small><p>${esc(n.speech)}</p>` : ''}${n.habits?.length ? `<small>Thói quen, chi tiết</small>${ul(n.habits)}` : ''}${n.never?.length ? `<small>Không bao giờ nói</small>${ul(n.never)}` : ''}</div>`; }
    if (st.goals?.length) h += H('Mục tiêu') + T(['Mục tiêu','Chỉ số','30 ngày','60 ngày','90 ngày'], st.goals.map(g => [esc(g.goal), esc(g.metric), esc(g.d30), esc(g.d60), esc(g.d90)]));
    if (st.personas?.length) h += H('Khán giả') + `<div class="pgrid2">${st.personas.map(p => `<div class="pbox"><b>${esc(p.name)}</b> <small class="muted">${esc(p.age || '')}</small><p>${esc(p.situation || '')}</p>
      ${p.jobs?.length ? `<small>Cần làm</small>${ul(p.jobs)}` : ''}${p.pains?.length ? `<small>Nỗi đau</small>${ul(p.pains)}` : ''}${p.wants?.length ? `<small>Mong muốn</small>${ul(p.wants)}` : ''}${p.words_they_use?.length ? `<small>Từ họ hay dùng</small><p>${p.words_they_use.map(w => `<span class="tag">${esc(w)}</span>`).join(' ')}</p>` : ''}</div>`).join('')}</div>`;
    if (st.positioning || st.differentiation?.length) h += H('Định vị và khác biệt') + (st.positioning ? `<p>${esc(st.positioning)}</p>` : '') + ul(st.differentiation);
    if (st.voice) h += H('Giọng thương hiệu', (st.voice.traits || []).join(' · ')) + `<div class="pgrid2"><div class="pbox"><small>Nên</small>${ul(st.voice.do)}</div><div class="pbox"><small>Không nên</small>${ul(st.voice.dont)}</div></div>` + (st.voice.examples?.length ? `<small class="muted">Câu ví dụ</small>${ul(st.voice.examples)}` : '');
    if (st.funnel?.length) h += H('Phễu và tỷ lệ nội dung') + `<div class="pbar">${st.funnel.map((f, i) => `<i style="flex:${+f.share_pct || 1};background:${['var(--g-violet)','var(--g-blue)','var(--g-pink)','var(--g-teal)'][i % 4]}" title="${esc(f.stage)} ${esc(String(f.share_pct))}%">${esc(f.stage)} ${esc(String(f.share_pct || ''))}%</i>`).join('')}</div>` + T(['Tầng','%','Mục tiêu','Định dạng'], st.funnel.map(f => [esc(f.stage), esc(String(f.share_pct ?? '')), esc(f.goal), esc((f.formats || []).join(', '))]));
    if (st.cadence?.length) h += H('Tần suất') + T(['Định dạng','Bài/tuần','Giờ thử (ET)'], st.cadence.map(c => [esc(c.format), esc(String(c.per_week ?? '')), esc(c.best_times_et)]));
    if (st.kpis?.length) h += H('KPI') + T(['Chỉ số','Đích','Cách đo'], st.kpis.map(k => [esc(k.metric), esc(k.target), esc(k.how)]));
    if (st.competitors?.length) h += H('Đối thủ và khoảng trống') + T(['Page cùng ngách','Đang làm','Khoảng trống'], st.competitors.map(c => [esc(c.name), esc(c.doing), esc(c.gap)]));
    if (st.risks?.length) h += H('Rủi ro, luật riêng') + ul(st.risks);
    if (st.sources?.length) h += H('Nguồn đã xem') + `<ul class="pul">${st.sources.map(x => `<li>${/^https?:\/\//.test(x.url || '') ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>` : esc(x.title || '')}</li>`).join('')}</ul>`;
  }
  if (Array.isArray(d.pillars)) {
    const tot = d.pillars.reduce((n, p) => n + (+p.share_pct || 0), 0);
    h += `<div class="pbar" style="margin-top:8px">${d.pillars.map((p, i) => `<i style="flex:${+p.share_pct || 1};background:${['var(--g-violet)','var(--g-blue)','var(--g-pink)','var(--g-teal)','var(--g-amber)'][i % 5]}">${esc(p.name)} ${esc(String(p.share_pct || ''))}%</i>`).join('')}</div>${tot && tot !== 100 ? `<div class="note warn">Tổng tỷ lệ là ${tot}%, chưa bằng 100%.</div>` : ''}`;
    h += `<div class="pgrid2">${d.pillars.map((p, i) => `<div class="pbox"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="tag acc">${i + 1}</span><b>${esc(p.name)}</b>${p.role ? `<span class="tag">${esc(p.role)}</span>` : ''}${p.funnel ? `<span class="tag">${esc(p.funnel)}</span>` : ''}<span class="tag ok">${esc(String(p.share_pct ?? ''))}%</span></div>
      ${p.name_vi ? `<small class="muted">${esc(p.name_vi)}</small>` : ''}<p>${esc(p.purpose || '')}${p.persona ? ` <span class="muted">· ${esc(p.persona)}</span>` : ''}</p>
      ${p.formats?.length ? `<small>Định dạng</small><p>${p.formats.map(f => `<span class="tag">${esc(f)}</span>`).join(' ')}</p>` : ''}
      ${p.subtopics?.length ? `<small>Chủ đề con</small>${ul(p.subtopics)}` : ''}${p.example_hooks?.length ? `<small>Hook mẫu</small>${ul(p.example_hooks)}` : ''}
      ${p.series ? `<small>Series</small><p>${esc(p.series)}</p>` : ''}${p.kpi ? `<small>KPI</small><p>${esc(p.kpi)}</p>` : ''}${p.avoid ? `<small>Không làm</small><p>${esc(p.avoid)}</p>` : ''}</div>`).join('')}</div>`;
    if (d.mix_check) h += `<div class="note">${esc(d.mix_check)}</div>`;
  }
  const c = d.calendar;
  if (c) {
    if (c.key_dates?.length) h += H('Dịp đáng chú ý') + T(['Ngày','Dịp','Dùng thế nào'], c.key_dates.map(k => [esc(k.date), esc(k.name), esc(k.use)]));
    (c.weeks || []).forEach(w => {
      h += H(`Tuần ${esc(String(w.week))}`, esc(w.theme || '')) + T(['Ngày','Giờ ET','Pillar','Dạng','Hook / góc nhìn','CTA, hình'], (w.posts || []).map(p => [
        `<b>${esc(p.day || '')}</b><br><small class="muted">${esc(p.date || '')}</small>`, esc(p.time_et || ''), `<span class="tag">${esc(p.pillar || '')}</span>`, esc(p.format || ''),
        `<b>${esc(p.hook || p.title || '')}</b>${p.angle ? `<br><span class="muted">${esc(p.angle)}</span>` : ''}${p.framework ? `<br><span class="tag">${esc(p.framework)}</span>` : ''}`,
        `${esc(p.cta || '')}${p.asset_brief ? `<br><small class="muted">Hình: ${esc(p.asset_brief)}</small>` : ''}${p.goal ? `<br><small class="muted">Mục tiêu: ${esc(p.goal)}</small>` : ''}`]));
    });
    if (c.pillar_mix?.length) h += H('Tỷ lệ pillar trong lịch') + T(['Pillar','Kế hoạch','Thực tế'], c.pillar_mix.map(m => [esc(m.pillar), esc(String(m.planned_pct ?? '')) + '%', esc(String(m.actual_pct ?? '')) + '%']));
  }
  if (d.notes) h += `<div class="note">${esc(d.notes)}</div>`;
  return h;
}
function ideaRow(rp, x){
  const meta = [x.altNames?.length ? 'Tên khác: ' + x.altNames.join(', ') : '', x.audience ? 'Khán giả: ' + x.audience : '', x.monetization ? 'Kiếm tiền: ' + x.monetization : ''].filter(Boolean);
  return `<div class="idea"><div class="bd"><b>${esc(x.name)}</b>${x.sample ? ' <span class="tag warn">Mẫu</span>' : ''}<p>${esc(x.why)}</p>${meta.map(m => `<p class="faint" style="margin:0">${esc(m)}</p>`).join('')}
    <div>${x.topics.map(t => `<span class="tag" style="margin:4px 4px 0 0">${esc(t)}</span>`).join('')}</div></div>
    <button class="btn btn-s btn-g" type="button" data-act="rp-idea-use" data-rp="${rp.id}" data-id="${x.id}">Dùng gợi ý này</button></div>`;
}
// Thẻ gợi ý buổi sáng: cài lịch, trạng thái lượt quét hôm nay, chủ đề mới và gợi ý page.
function morningCard(rp, compact){
  const d = rp.daily, t0 = startOfToday();
  const scan = rp.scans.slice().reverse().find(s => s.auto && s.at >= t0);
  const task = scan && byId('tasks', scan.taskId);
  const fresh = rp.topics.filter(t => (t.firstAt || t.at) >= t0).sort((x, y) => score(y) - score(x));
  const ideas = rp.pageIdeas.filter(x => x.at >= t0);
  const mk = MARKETS.find(x => x.id === rp.market);
  let status;
  if (!d.on) status = 'Đang tắt.';
  else if (!task) status = `Lượt tới: ${new Date().toTimeString().slice(0, 5) < d.time ? 'hôm nay' : 'sáng mai'} lúc ${d.time} (giờ Việt Nam).`;
  else status = { moi:`Đã giao lúc ${d.time}, chờ agent nhận việc.`, 'dang-lam':'Agent đang quét.', 'can-sua':'Bạn đã trả lại, agent đang sửa.',
    'cho-duyet':'Agent đã nộp gợi ý. Duyệt để nhận vào danh sách.', xong:`Đã nhận ${fresh.length} chủ đề mới.` }[task.status];
  const head = `<div class="mhead"><div><h2><span class="ki-sun">${IC.sun}</span>Gợi ý sáng nay <small>${esc(mk.name)}</small></h2><p class="sub" style="margin:0">${status}</p></div>
    ${task && task.status === 'cho-duyet' ? `<button class="btn btn-g btn-s" type="button" data-act="task" data-id="${task.id}">Duyệt gợi ý</button>` : ''}
    ${compact ? `<a class="btn btn-s" href="#research/${rp.id}/quet">Mở Research</a>` : ''}</div>${task ? liveBlock(task) : ''}`;
  const body = (fresh.length ? `<h3 class="h3">Chủ đề mới (${fresh.length})</h3>` + fresh.slice(0, compact ? 3 : 6).map(t => topicRow(rp, t, false)).join('') : '') +
    (ideas.length ? `<h3 class="h3">Gợi ý page (${ideas.length})</h3>` + ideas.map(x => ideaRow(rp, x)).join('') : '');
  if (compact) return `<div class="card morning" style="margin-bottom:14px">${head}${body}</div>`;
  return `<div class="card morning" style="margin-bottom:14px">${head}
    <div class="mset"><label class="tgl"><span class="tg"><input type="checkbox" data-act="rp-daily" ${d.on ? 'checked' : ''} aria-label="Bật quét mỗi sáng"><i></i></span>Quét mỗi sáng</label>
      <label>Lúc <input class="inp" type="time" data-rp="daily.time" value="${esc(d.time)}" style="width:auto;padding:5px 8px"></label>
      <label>Tối đa <select class="inp" data-rp="daily.count" style="width:auto;padding:5px 8px">${[5, 10, 15].map(n => `<option ${+d.count === n ? 'selected' : ''}>${n}</option>`).join('')}</select> chủ đề</label></div>
    ${API ? '<p class="faint" style="margin:8px 0 0;font-size:12px">Cần server đang chạy lúc đó, và agent research trên máy người phụ trách đang chờ việc. Server bật muộn thì giao bù ngay khi bật.</p>' : '<div class="note warn">Bản thử không có server nên lịch không chạy.</div>'}
    ${body}</div>`;
}
function vResearch(){

      <details style="margin-top:14px"><summary class="muted" style="cursor:pointer">Dán kết quả JSON từ agent</summary>

    if (rp.pageIdeas.length) html += `<div class="card" style="margin-bottom:14px"><h2>Agent gợi ý page <small>${rp.pageIdeas.length}</small></h2><p class="sub">Bấm “Dùng gợi ý này” để điền tên page và chọn sẵn các chủ đề của gợi ý.</p>${rp.pageIdeas.slice().reverse().map(x => ideaRow(rp, x)).join('')}</div>`;

function vBoard(){
  const list = ws.tasks.filter(t => boardFilter === 'all' || t.agentId === boardFilter);
  const chips = `<div class="filters" role="group" aria-label="Lọc theo agent"><button class="chip t" type="button" data-act="filter" data-id="all" aria-pressed="${boardFilter === 'all'}">Tất cả</button>` +
    ws.agents.map(a => `<button class="chip" type="button" data-act="filter" data-id="${a.id}" aria-pressed="${boardFilter === a.id}"><span class="dot" style="background:${agentColor(a)};width:10px;height:10px;border-radius:50%;margin-left:6px"></span>${esc(a.name)}</button>`).join('') + `</div>`;
  const cols = COLS.map(st => {
    const ts = list.filter(t => t.status === st).sort((x, y) => y.updatedAt - x.updatedAt);
    return `<div class="col" data-st="${st}"><h3>${tag(ST[st])}<span class="cnt">${ts.length || ''}</span></h3>` +
      ts.map(t => { const a = byId('agents', t.agentId); const p = byId('pages', t.pageId);
        return `<button class="tcard" type="button" data-act="task" data-id="${t.id}"><b>${esc(t.title)}</b>${liveBlock(t, true)}
          <div class="ln"><span class="dot" style="background:${a ? agentColor(a) : 'var(--faint)'};width:9px;height:9px;border-radius:50%;flex:none"></span><span>${a ? esc(a.name) : 'Chưa gán agent'}</span></div>
          <div class="ln">${a ? `<span>Bước ${t.step + 1}/${a.steps.length}</span>` : ''}${p ? `<span class="tag">${esc(p.name)}</span>` : ''}<span class="sp"></span>${t.ready ? '<span class="tag ok">Sẵn sàng đăng</span>' : ''}${t.verdict === 'truot' ? '<span class="tag bad">Leader trả</span>' : ''}${t.blocked ? '<span class="tag bad">Agent lỗi</span>' : ''}${t.returns ? `<span class="tag bad">Trả ${t.returns}</span>` : ''}</div></button>`; }).join('') + `</div>`;

  return { title:'Bảng điều phối', desc:'Task chạy giữa các agent. Leader giao việc, agent làm, bạn duyệt ở các bước đã bật.',

// ================= View: Tổ chức agent =================
function agentState(a){
  const busy = ws.tasks.find(t => t.agentId === a.id && t.status === 'dang-lam');
  if (busy) return `<div class="state busy"><i></i><span>Đang làm: ${esc(busy.title)}</span></div>`;
  if (agentOnline(a.id)) return `<div class="state on"><i></i><span>Đang chạy, chờ việc</span></div>`;
  const wait = ws.tasks.filter(t => t.agentId === a.id && ['moi','can-sua'].includes(t.status)).length;
  return `<div class="state"><i></i><span>${API ? (wait ? `Chưa chạy · ${wait} task chờ` : 'Chưa chạy trên máy') : 'Bản thử'}</span></div>`;
}
function orgCard(role, i){
  const R = ROLES[role], ags = ws.agents.filter(a => roleOf(a) === role);
  if (!ags.length) return `<div class="ocard missing" style="--g:${R.color}"><span class="step">${i}</span><span class="bot l" style="--g:${R.color}">${IC.bot}</span><b>${R.label}</b><p>${esc(R.short)}</p>
    <button class="btn btn-s btn-g" type="button" data-act="org-create" data-tpl="${role}">${IC.plus}Tạo agent ${R.label}</button></div>`;
  return ags.map(a => { const s = stats(a), w = ws.tasks.filter(t => t.agentId === a.id && t.status === 'cho-duyet').length;
    return `<div class="ocard" style="--g:${R.color}"><span class="step">${i}</span>
      <div class="top">${bot(a,'l')}<div style="min-width:0;flex:1"><span class="role">${R.label}</span><span class="nm" title="${esc(a.name)}">${esc(a.name)}</span></div></div>
      ${agentState(a)}<p>${esc(a.mission || R.short)}</p>
      <div class="mini"><div><span>Task mở</span><b>${s.open}</b></div><div><span>Chờ duyệt</span><b>${w}</b></div><div><span>Qua lần đầu</span><b>${s.firstPass == null ? '–' : s.firstPass + '%'}</b></div><div><span>Second Brain</span><b>${s.lessons}</b></div></div>
      <div>${tag(ASTATUS[a.status])}</div>
      <div class="acts"><a class="btn btn-s" href="#agent/${a.id}/brain">${IC.brain}Brain</a><button class="btn btn-s" type="button" data-act="open-agent" data-id="${a.id}">Mở</button></div></div>`; }).join('');
}
function goalRow(g){
  const p = g.target ? Math.max(0, Math.min(100, Math.round((+g.current || 0) / +g.target * 100))) : 0, pg = byId('pages', g.pageId);
  return `<div class="goal"><div class="gh"><b>${esc(g.title)}</b>${pg ? `<span class="tag">${esc(pg.name)}</span>` : ''}${g.due ? `<span class="tag ${g.due < new Date().toISOString().slice(0, 10) && p < 100 ? 'bad' : ''}">Hạn ${esc(g.due.split('-').reverse().join('/'))}</span>` : ''}
    <button class="icbtn" type="button" data-act="goal-edit" data-id="${g.id}" aria-label="Sửa mục tiêu" style="width:28px;height:28px">${IC.board}</button></div>
    <span class="muted" style="font-size:12.5px">${esc(g.metric || 'Chỉ số')}: <b style="color:var(--ink)">${esc(String(g.current || 0))}</b> / ${esc(String(g.target || '?'))} ${esc(g.unit || '')} · ${p}%</span>
    <div class="prog"><i style="width:${p}%"></i></div></div>`;
}

// Ba màn hình chính cho việc hằng ngày. Các màn hình cũ (Research, Bảng task, Claude Code…) nằm trong “Cài đặt, nâng cao”.
let RUNS = [];
// Agent đang chạy trên máy (Claude Code → Agent đang chạy). Trả true khi có thay đổi.
async function loadRuns(){
  if (!API || !HUB) return false;
  try { const r = await cfetch('/api/run'); const k = JSON.stringify(r.map(x => [x.key, x.running])); const ch = k !== loadRuns.k; loadRuns.k = k; RUNS = r; return ch; }
  catch(e) { return false; }
}
const RUN_KEYS = r => ['cli-' + r, ['research','leader','designer'].includes(r) ? r : null].filter(Boolean);
const runOf = r => r ? RUNS.find(x => RUN_KEYS(r).includes(x.key) && x.running) || null : null;
const isOn = a => !!runOf(roleOf(a)) || agentOnline(a.id);
const ago = t => { const m = Math.max(0, Math.round((serverNow() - t) / 60e3)); return m < 60 ? `${m} phút` : m < 1440 ? `${Math.round(m / 60)} giờ` : `${Math.round(m / 1440)} ngày`; };

// Ảnh và đoạn chữ đại diện cho kết quả mới nhất của task, để duyệt nhanh.
function previewOf(t){
  const raw = lastOut(t) || '', d = parseOutput(raw);
  let img = '';
  const walk = (o, depth) => {
    if (img || o == null || depth > 6) return;
    if (typeof o === 'string') {
      if (/^\/media\/[\w.\-]+\.(png|jpe?g|webp)$/i.test(o)) img = o;
      else if (/^\s*<svg[\s>]/i.test(o) && /<\/svg>\s*$/i.test(o)) img = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(o);
      return;
    }
    if (typeof o === 'object') for (const k in o) { if (k !== '_brain') walk(o[k], depth + 1); if (img) return; }
  };
  walk(d, 0);
  let text = '';
  if (d) {
    const pick = [typeof d.caption === 'string' ? d.caption : d.caption?.text, d.summary, d.hooks?.[0]?.text || d.hooks?.[0], d.ideas?.[0]?.title || d.ideas?.[0]?.idea,
      d.reasons?.[0]?.detail, d.channels?.[0]?.name && `Đề xuất ${d.channels.length} kênh: ${d.channels.map(c => c.name).join(', ')}`,
      d.topics?.[0]?.title && `${d.topics.length} chủ đề: ${d.topics.map(x => x.title).slice(0, 4).join(', ')}`, d.notes, d._brain?.tom_tat];
    text = pick.find(x => typeof x === 'string' && x.trim()) || '';
  }
  if (!text) text = raw.replace(/[{}\[\]"]/g, ' ').replace(/\s+/g, ' ').trim();
  return { img, text:text.slice(0, 280) };
}

// Sau mỗi task xong, agent có một mục “Tổng kết task” trong Second Brain: agent tự viết (khóa _brain, server lưu),
// dashboard thêm kết quả duyệt và nhận xét đã nhận. Agent không tự viết thì dashboard tổng hợp từ kết quả.
async function syncRecaps(){
  if (syncRecaps.busy) return; syncRecaps.busy = true;
  try {
    for (const t of ws.tasks) {
      if (t.status !== 'xong' || t.recapAt) continue;
      const a = byId('agents', t.agentId); if (!a) continue;
      const notes = ws.brain.filter(b => b.taskId === t.id);
      const self = notes.filter(b => b.kind === 'tong-ket').sort((x, y) => y.at - x.at)[0];
      const fb = notes.filter(b => ['tra-lai', 'duyet', 'leader'].includes(b.source)).map(b => b.text);
      const reviewed = t.history.some(h => h.who === me && /duyệt/i.test(h.text));
      const outcome = t.verdict === 'dat' ? 'Chấm đạt, bài sẵn sàng đăng' : t.verdict === 'truot' ? 'Chấm trượt, đã giao Content sửa'
        : !reviewed ? 'Hoàn thành' : t.returns ? `Được duyệt sau ${t.returns} lần làm lại` : 'Được duyệt ngay lần đầu';
      const extra = fb.length ? ` Nhận xét đã nhận: ${fb.slice(0, 3).join(' · ')}` : '';
      if (self) { if (!self.text.includes('Kết quả:')) { self.text = `${self.text}\nKết quả: ${outcome}.${extra}`; await put('brain', self); } }
      else { const p = previewOf(t); addLesson(a.id, `${outcome}.${p.text ? ` Đã nộp: ${p.text.slice(0, 200)}` : ''}${extra}`, 'tu-tong-hop', a.id, t.id, { kind:'tong-ket', title:t.title.slice(0, 90) }); }
      t.recapAt = now(); await put('tasks', t);
    }
  } finally { syncRecaps.busy = false; }
}

function attention(){
  const out = [];
  const lu = settings().limitUntil;
  if (lu > serverNow()) out.push({ c:'var(--warn)', t:'Gói Claude đã hết hạn mức 5 giờ', d:`Các agent tạm nghỉ, tự làm tiếp sau ${new Date(lu).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' })}. Đã nâng hoặc reset gói thì bấm “Chạy lại ngay”.`, b:HUB ? '<button class="btn btn-s btn-g" type="button" data-act="limit-clear">Chạy lại ngay</button>' : '' });
  for (const a of ws.agents) {
    const r = roleOf(a), wait = ws.tasks.filter(t => t.agentId === a.id && ['moi', 'can-sua'].includes(t.status) && !t.blocked).length;
    if (wait && API && !isOn(a) && !(lu > serverNow())) out.push({ c:'var(--danger)', t:`${a.name} đang tắt`, d:`${wait} việc đang chờ agent nhận`, b:HUB && r ? `<button class="btn btn-s btn-g" type="button" data-act="run-toggle" data-role="${r}">Bật</button>` : '' });
  }
  for (const t of ws.tasks) {
    const a = byId('agents', t.agentId);
    if (t.status === 'dang-lam' && serverNow() - (t.progress?.at || t.updatedAt || 0) > 30 * 60e3)
      out.push({ c:'var(--warn)', t:`${a?.name || 'Agent'} có thể bị treo`, d:`“${t.title}” · không có tiến triển ${ago(t.progress?.at || t.updatedAt)}`, b:`<button class="btn btn-s" type="button" data-act="q-requeue" data-id="${t.id}">Trả về hàng chờ</button>` });
  }
  // Task bị khóa vì lỗi: gom theo agent, chỉ hiện lỗi gần nhất.
  const blocked = ws.tasks.filter(t => t.blocked && t.status !== 'xong').sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0));
  [...new Set(blocked.map(t => t.agentId))].forEach(id => { const ts = blocked.filter(t => t.agentId === id), a = byId('agents', id), err = String(ts[0].lastError || '');
    const hint = /authentication|api.?key|x-api-key/i.test(err) ? 'Thiếu khóa ANTHROPIC_API_KEY. Bật agent bằng công tắc ở Đội agent (chạy bằng Claude CLI) rồi bấm Cho chạy lại.' : err.slice(0, 120);
    out.push({ c:'var(--danger)', t:`${ts.length} task của ${a?.name || 'agent'} bị khóa vì lỗi`, d:hint, b:`<button class="btn btn-s" type="button" data-act="task" data-id="${ts[0].id}">Xem</button>` }); });
  const chs = channelsAll(), wait = chs.filter(x => x.c.status === 'cho-leader').length, nopage = chs.filter(x => x.c.status !== 'tra-lai' && !pageForChannel(x.c)).length;
  if (wait) out.push({ c:'var(--info)', t:`${wait} kênh chờ Leader duyệt`, d:'Kiểm tên rồi duyệt hoặc trả lại từng kênh', b:`<a class="btn btn-s" href="#research">Xem</a>` });
  if (nopage) out.push({ c:'var(--info)', t:`${nopage} kênh chưa có page`, d:'Tạo page trên Facebook rồi kết nối vào AUTOFB', b:`<a class="btn btn-s" href="#pages">Xem</a>` });
  return out;
}

// Markdown gọn: khối code, tiêu đề, danh sách, đậm, nghiêng, code trong dòng, link. Luôn escape trước.
function ccMd(t){

    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return String(t).split(/```/).map((part, i) => {
    if (i % 2) return `<pre>${esc(part.replace(/^[\w-]*\n/, ''))}</pre>`;
    const lines = part.split('\n'); let out = '', list = null, para = [], k = 0;
    const flush = () => { if (para.length) { out += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
    const close = () => { if (list) { out += `</${list}>`; list = null; } };
    while (k < lines.length) {
      const l = lines[k];
      if (!l.trim()) { flush(); close(); k++; continue; }
      if (/^\s*\|.*\|\s*$/.test(l)) { flush(); close(); const rows = [];
        while (k < lines.length && /^\s*\|.*\|\s*$/.test(lines[k])) { if (!/^\s*\|?\s*:?-{2,}/.test(lines[k])) rows.push(lines[k].trim().replace(/^\||\|$/g, '').split('|')); k++; }
        out += `<div class="cl-tw"><table>${rows.map((r, j) => `<tr>${r.map(c => j ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join('')}</tr>`).join('')}</table></div>`; continue; }

}

async function agentsOnly(){
  const olds = ws.members.filter(m => m.id !== OP).map(m => m.id);
  if (!olds.length && byId('members', OP)) return;
  const isOld = id => olds.includes(id);
  if (!byId('members', OP)) await put('members', { id:OP, name:'Bạn', role:'PO', color:PALETTE[0] });
  for (const a of ws.agents) if (a.owner !== OP) { a.owner = OP; await put('agents', a); }
  for (const t of ws.tasks) {
    let ch = false;
    if (isOld(t.from) || !t.from) { t.from = OP; ch = true; }
    if (isOld(t.to) || !t.to) { t.to = OP; ch = true; }
    (t.outputs || []).forEach(o => { if (isOld(o.by)) { o.by = OP; ch = true; } });
    (t.history || []).forEach(h => { if (isOld(h.who)) { h.who = OP; ch = true; } });
    if (ch) await put('tasks', t);
  }
  for (const b of ws.brain) if (isOld(b.by)) { b.by = OP; await put('brain', b); }
  for (const r of ws.research) if (isOld(r.createdBy)) { r.createdBy = OP; await put('research', r); }
  for (const id of olds) await del('members', id);
